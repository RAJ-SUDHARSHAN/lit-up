<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g transform="rotate(-10 32 32)">
    <!-- Shadow -->
    <rect x="13" y="10" width="38" height="46" rx="5" fill="rgba(0,0,0,0.18)"/>
    <!-- Card body -->
    <rect x="11" y="8" width="38" height="46" rx="5" fill="white" stroke="#ccc" stroke-width="1.5"/>
    <!-- Top-left: A + small spade -->
    <text x="16" y="22" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#111">A</text>
    <text x="17" y="31" font-family="serif" font-size="9" fill="#111">♠</text>
    <!-- Center large spade -->
    <text x="30" y="44" font-family="serif" font-size="22" fill="#111" text-anchor="middle">♠</text>
    <!-- Bottom-right: inverted A + small spade (rotated 180 around card center 30,31) -->
    <g transform="rotate(180 30 31)">
      <text x="16" y="22" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#111">A</text>
      <text x="17" y="31" font-family="serif" font-size="9" fill="#111">♠</text>
    </g>
  </g>
</svg>
